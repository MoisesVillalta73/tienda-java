name: Despliegue

on:

  push:

    branches: [main]

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v3

    - uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '17'

    - name: Compilar Produccion

      run: javac -d out src/*.java

    - name: Ejecutar Programa

      run: java -cp out Main