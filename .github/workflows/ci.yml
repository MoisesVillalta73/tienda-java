name: Integracion Continua

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Instalar Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar aplicación
        run: javac -d out src/Main.java

      - name: Compilar pruebas
        run: javac -d out test/MainTest.java

      - name: Ejecutar pruebas
        run: java -cp out MainTest